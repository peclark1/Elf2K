name: AVI ELF II ROM development build

on:
  push:
    branches:
      - feature/avi-elf2-hyperboard-rom
      - feature/avi-netronics-compatible-rom
      - feature/avi-com2-38400-default-chip8
      - feature/avi-chip8-fx-dispatch-fix
  pull_request:
  workflow_dispatch:

jobs:
  build-avi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3
      - name: Build AVIElf2 image and verify layout/checksum
        run: ELF2K_BUILD_DIR="$GITHUB_WORKSPACE/.build/avi-pass1" bash sw/build/build-avi.sh
      - name: Independently repeat clean AVI build
        run: ELF2K_BUILD_DIR="$GITHUB_WORKSPACE/.build/avi-pass2" bash sw/build/build-avi.sh
      - name: Require byte-identical repeat builds
        run: |
          cmp .build/avi-pass1/work/AVIElf2.hex .build/avi-pass2/work/AVIElf2.hex
          python3 sw/build/verify-avi.py .build/avi-pass2/work/AVIElf2.hex
      - name: Prepare labelled One ROM diagnostic binary and Intel HEX
        run: python3 sw/build/prepare-one-rom.py .build/avi-pass1/work/AVIElf2.hex .build/avi-pass1/work
      - name: Package checksum-identified GAME27 programming files
        run: |
          cd .build/avi-pass1/work
          test "$(wc -c < AVIElf2-COM2-38400-CHIP8-GAME27-OneROM.bin)" -eq 32768
          sha256sum AVIElf2-COM2-38400-CHIP8-GAME27-OneROM.bin \
                    AVIElf2-COM2-38400-CHIP8-GAME27-OneROM.hex > SHA256SUMS-GAME27.txt
          sha256sum --check SHA256SUMS-GAME27.txt
      - name: Upload GAME27 OneROM programming ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AVIElf2-COM2-38400-CHIP8-GAME27-OneROM-PROGRAMMING
          path: |
            .build/avi-pass1/work/AVIElf2-COM2-38400-CHIP8-GAME27-OneROM.bin
            .build/avi-pass1/work/AVIElf2-COM2-38400-CHIP8-GAME27-OneROM.hex
            .build/avi-pass1/work/README-Netronics-OneROM-EXPERIMENTAL.txt
            .build/avi-pass1/work/SHA256SUMS-GAME27.txt
          if-no-files-found: error
      - name: Upload development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AVIElf2-development
          path: |
            .build/avi-pass1/work/*.hex
            .build/avi-pass1/work/*.lst
            .build/avi-pass1/work/config.inc
            .build/avi-pass1/work/*.bin
            .build/avi-pass1/work/README-Netronics-OneROM-EXPERIMENTAL.txt
            .build/avi-pass1/work/chip8-rom-layout.json
          if-no-files-found: ignore
